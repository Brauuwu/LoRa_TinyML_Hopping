# ═══════════════════════════════════════════════════════════════════════════
# Cấu hình Nginx cho LoRa Gateway trên Raspberry Pi CM4
# Cổng 80 - Truy cập trực tiếp qua IP Wi-Fi (Không cần gõ cổng hay đăng nhập)
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Cho phép truy cập bằng bất kỳ địa chỉ IP hoặc hostname nào
    server_name _;

    # Thư mục chứa giao diện Web Admin Dashboard
    root /var/www/loragw;
    index index.html;

    # 1. Định tuyến các file tĩnh (HTML, CSS, JS)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 2. Reverse Proxy toàn bộ REST API về C++ Daemon Gateway (Cổng 8080)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;

        # WebSocket & Keep-Alive headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tắt cache API
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        # Thời gian chờ
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
