; PlatformIO Project Configuration File for ESP32 Communication Test
; Board: ESP32 DevKit V1 + SX1278 (Ra-02 433MHz) + OLED SSD1306
; Mục đích: Test truyền thông LoRa giữa ESP32 và Raspberry Pi

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.1.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.6
