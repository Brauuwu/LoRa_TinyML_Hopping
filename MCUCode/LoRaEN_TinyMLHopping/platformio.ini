; PlatformIO Project Configuration File for ESP32 TinyML Channel Hopping Node
; In-chip inference for channel selection

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    jgromes/RadioLib@^7.1.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.6
